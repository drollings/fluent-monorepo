[package]
name = "protopyne-egui"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
default = []
demo = ["dep:eframe", "eframe/glow", "eframe/wayland", "eframe/x11"]

[dependencies]
common-core = { path = "../common-core" }
fluent-concurrency = { path = "../fluent-concurrency" }
fluent-dag = { path = "../dag" }
fluent-egui = { path = "../fluent-egui" }
fluent-wvr = { path = "../fluent-wvr" }
protopyne-chart-model = { path = "../protopyne-chart-model" }
protopyne-chart-scale = { path = "../protopyne-chart-scale" }
protopyne-kernels = { path = "../protopyne-kernels", features = ["pine"] }
protopyne-types = { path = "../protopyne-types" }
bon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
egui = { version = "0.36" }
eframe = { version = "0.36", optional = true, default-features = false }

[dev-dependencies]
chrono = { workspace = true }
criterion = { workspace = true }
rust_decimal = { workspace = true }
protopyne-server = { path = "../protopyne-server" }

[[bench]]
name = "chart_budget"
harness = false

[[example]]
name = "demo"
required-features = ["demo"]

[lints]
workspace = true
