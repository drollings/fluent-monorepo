[package]
name = "protopyne-egui"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
default = ["bytecode"]
demo = ["dep:eframe", "eframe/glow", "eframe/wayland", "eframe/x11"]
server-gateway = ["dep:protopyne-server"]
# `bytecode` runs the Pine indicator plugin on the compiled slot VM.
# Default-on: the chart pane's script evaluator runs the one compiled path.
bytecode = ["protopyne-kernels/bytecode"]

[dependencies]
common-core = { path = "../common-core" }
fluent-concurrency = { path = "../fluent-concurrency" }
fluent-dag = { path = "../dag" }
fluent-egui = { path = "../fluent-egui" }
fluent-wvr = { path = "../fluent-wvr" }
protopyne-chart-model = { path = "../protopyne-chart-model" }
protopyne-chart-scale = { path = "../protopyne-chart-scale" }
protopyne-kernels = { path = "../protopyne-kernels", features = ["pine"] }
protopyne-server = { path = "../protopyne-server", optional = true }
protopyne-types = { path = "../protopyne-types" }
protopyne-view = { path = "../protopyne-view" }
bon = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
egui = { version = "0.36" }
eframe = { version = "0.36", optional = true, default-features = false }

[dev-dependencies]
criterion = { workspace = true }
# The tree oracle for proof: test targets compare the compiled loop against
# it, while shipping builds carry no interpreter. A dev-dependency never
# reaches the shipping library.
protopyne-kernels = { path = "../protopyne-kernels", features = ["oracle"] }
rust_decimal = { workspace = true }
reqwest = { workspace = true }
skrifa = { version = "0.44" }
tempfile = { workspace = true }
protopyne-server = { path = "../protopyne-server" }
protopyne-store = { path = "../protopyne-store", default-features = false }
protopyne-strategy = { path = "../protopyne-strategy" }
protopyne-view = { path = "../protopyne-view" }

[[bench]]
name = "chart_budget"
harness = false

[[example]]
name = "demo"
required-features = ["demo"]

[[example]]
name = "terminal"
required-features = ["server-gateway", "demo"]

[lints]
workspace = true
