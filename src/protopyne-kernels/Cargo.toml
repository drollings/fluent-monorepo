[package]
name = "protopyne-kernels"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
default = []
# `research` pulls in the polars-backed offline surface: research frames,
# the Expr-parity harness, and the calibration gate. Default-off so the
# shipping library carries no dataframe weight unless a consumer asks for
# it; test targets proving Expr parity enable it explicitly.
research = ["dep:polars"]
# `pine` pulls in the Pine language runtime (lexer/parser/evaluator,
# built-ins, native-call providers). Default-off; the engine's own suites,
# the server's headless proofs, and benches comparing against Pine enable
# it explicitly.
pine = []
# `bytecode` runs the Pine engine on the compiled slot VM behind an
# explicit per-engine selection (the compiled loop is the default).
# Default-off; implies `pine`. Test targets proving loop/engine parity
# enable it explicitly.
bytecode = ["pine"]
# `oracle` compiles the tree-walk interpreter behind `pine::oracle` (and the
# test-only `OracleEngine` collaborator). Default-off and dev-only: test
# builds always have it (`cfg(test)`), while shipping builds carry no
# interpreter. Test targets comparing the loop against the tree enable it
# explicitly.
oracle = []

[dependencies]
protopyne-types = { path = "../protopyne-types" }
common-core = { path = "../common-core" }
fluent-wvr = { path = "../fluent-wvr" }
fluent-dag = { path = "../dag" }
bon = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
# `polars-parquet` is compiled non-optionally by polars 0.50 but carries no
# codec or reader/writer surface unless the `parquet` feature is enabled,
# and the feature is deliberately not enabled: columnar ingest and sealed
# artifacts decode through upstream `arrow`/`parquet` in the store crate,
# never through polars.
polars = { version = "0.50", optional = true, default-features = false, features = ["lazy", "rolling_window", "ewma", "abs", "cum_agg", "log", "moment", "trigonometry", "sign", "round_series"] }

[dev-dependencies]
chrono = { workspace = true }
criterion = { workspace = true }
csv = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "mtf_streaming"
harness = false

[[bench]]
name = "pine_eval"
harness = false
required-features = ["pine"]

# Production-shape refusal probe for the build matrix: asserts the typed
# load-time diagnostics in builds without the oracle, and today's
# selections in builds with it. Only builds where the compiled loop
# exists; `cargo test` checks compilation, the matrix runs both shapes.
[[example]]
name = "production_refusal_probe"
required-features = ["pine", "bytecode"]

[[bench]]
name = "fetch_tick"
harness = false

[lints]
workspace = true
