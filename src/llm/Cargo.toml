reqwest = { workspace = true }
bon = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
lru = { workspace = true }
rusqlite = { workspace = true }
httpdate = { workspace = true }
sha2 = { workspace = true }
