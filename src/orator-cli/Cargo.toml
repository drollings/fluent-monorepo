[package]
name = "orator-cli"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
common-core = { path = "../common-core", features = ["http"] }
fluent-concurrency = { path = "../fluent-concurrency" }
fluent-llm = { path = "../llm" }
fluent-wvr = { path = "../fluent-wvr" }
futures-util = { workspace = true }
orator-audio = { path = "../orator-audio" }
orator = { path = "../orator" }
orator-desktop = { path = "../orator-desktop" }
orator-agent = { path = "../orator-agent" }
orator-models = { path = "../orator-models" }
orator-voice = { path = "../orator-voice" }
ratatui = "0.30"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
orator-daemon = { path = "../orator-daemon" }
orator-memory = { path = "../orator-memory" }
async-trait = { workspace = true }
httpmock = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "it_parity"
path = "tests/it_parity.rs"

[[test]]
name = "it_end_to_end"
path = "tests/it_end_to_end.rs"

[features]
live-ai = []

[[test]]
name = "progress"
path = "tests/progress.rs"

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["live-ai"]

[lints]
workspace = true
