[package]
name = "protopyne-store"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
default = ["parquet"]
# `parquet` pulls in the Arrow/Parquet surface: the sealed-snapshot writer
# and reader behind the content-addressed artifact, plus the market-data
# ingest reader for vendor OHLCV files. Default-on for the shipping binary;
# with it off the crate still builds and the file-backed tape stays fully
# testable, and both parquet surfaces report a disabled feature rather
# than failing to compile. Upstream `arrow`/`parquet` is the sole data-path
# codec: both readers decode through the one shared `arrow_decode` layer,
# and `polars` stays out of the data path — the research frame boundary is
# a separate consumer.
parquet = ["dep:arrow", "dep:parquet"]

[dependencies]
common-core = { path = "../common-core" }
fluent-wvr = { path = "../fluent-wvr" }
fluent-concurrency = { path = "../fluent-concurrency" }
protopyne-types = { path = "../protopyne-types" }
bon = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
arrow = { version = "59", optional = true, default-features = false }
# `snap` writes the sealed artifacts; `zstd` reads market files (the
# announced vendor format is zstd-compressed). A file in any other codec
# refuses with the parquet error naming it, never a silent empty read.
parquet = { version = "59", optional = true, default-features = false, features = ["arrow", "snap", "zstd"] }

[dev-dependencies]
protopyne-kernels = { path = "../protopyne-kernels" }
protopyne-server = { path = "../protopyne-server" }
criterion = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "coverage_scale"
harness = false

[lints]
workspace = true