[package]
name = "orator-stt"
version.workspace = true
edition.workspace = true
autotests = false

[dependencies]
common-core = { path = "../common-core" }
fluent-wvr = { path = "../fluent-wvr" }
fluent-concurrency = { path = "../fluent-concurrency" }
internment = { workspace = true }
orator-core = { path = "../orator-core" }
serde = { workspace = true }
serde_json = { workspace = true }
transcribe-cpp = "=0.4.1"
whisper-rs = "0.16"

[dev-dependencies]
fluent-concurrency = { path = "../fluent-concurrency" }
orator-audio = { path = "../orator-audio" }
orator-core = { path = "../orator-core" }
orator-models = { path = "../orator-models" }
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
live-ai = []
# AMD ROCm/HIP ggml backend for moonshine (`transcribe_cpp::Backend::Rocm`).
# Strictly opt-in: enabling it requires the ROCm toolchain (hipcc) at build
# time and fails the build where ROCm is absent, so default (CI) builds stay
# CPU-only. Build with `--features orator-stt/rocm`, then set `stt.gpu = true`.
rocm = ["transcribe-cpp/rocm"]

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["live-ai"]

[lints]
workspace = true
