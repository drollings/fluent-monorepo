[package]
name = "protopyne-strategy"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
default = ["bytecode"]
# `pine` enables the Pine-backed signal.
pine = ["protopyne-kernels/pine"]
# `bytecode` runs the Pine signal's evaluator on the compiled slot VM.
# Default-on: the shipped decision closure runs the one compiled path.
bytecode = ["pine", "protopyne-kernels/bytecode"]
# `oracle` compiles the tree-walk opt-out behind `PineExecution::TreeWalk`
# (and the kernels interpreter it selects). Default-off and dev-only:
# test builds always have it, shipping builds never select it.
oracle = ["protopyne-kernels/oracle"]
# `test-support` exposes `fixtures` (one grant baseline + the deny order) to
# downstream test targets. Never a runtime surface; off in every shipping build.
test-support = []
# `research` gates research-only sizing surface (capped fractional-Kelly):
# compile-time, never a runtime flag. Empty on purpose — the policy prices
# observed estimates, so it needs no dataframe surface and must not drag one
# into the decision closure.
research = []

[dependencies]
protopyne-types = { path = "../protopyne-types" }
protopyne-kernels = { path = "../protopyne-kernels", default-features = false }
common-core = { path = "../common-core" }
fluent-wvr = { path = "../fluent-wvr" }
bon = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The tree oracle for proof: test targets compare the compiled loop against
# it, while shipping builds carry no interpreter. A dev-dependency never
# reaches the shipping library.
protopyne-kernels = { path = "../protopyne-kernels", features = ["oracle"] }

[lints]
workspace = true
