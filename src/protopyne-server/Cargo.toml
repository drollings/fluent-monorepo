[package]
name = "protopyne-server"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
default = ["bytecode"]
# `pine` passes through the kernels Pine runtime for the headless
# integration proofs and the native-vs-Pine bench.
pine = ["protopyne-kernels/pine"]

# `bytecode` passes the compiled Pine engine through to the server's Pine
# call sites. Default-on: the shipped server runs the one compiled path.
bytecode = ["pine", "protopyne-kernels/bytecode"]

[dependencies]
protopyne-types = { path = "../protopyne-types" }
protopyne-kernels = { path = "../protopyne-kernels", default-features = false }
protopyne-strategy = { path = "../protopyne-strategy" }
# The store's `parquet` surface is on the server's data path: the Parquet
# history arm ingests market OHLCV files through the store's reader, so the
# feature is enabled explicitly here. The server still names no Arrow/Parquet
# types of its own — the schema vocabulary stays behind the store boundary.
protopyne-store = { path = "../protopyne-store", default-features = false, features = ["parquet"] }
protopyne-venue = { path = "../protopyne-venue" }
protopyne-chart-model = { path = "../protopyne-chart-model" }
protopyne-view = { path = "../protopyne-view" }
common-core = { path = "../common-core" }
fluent-concurrency = { path = "../fluent-concurrency" }
fluent-dag = { path = "../dag" }
fluent-wvr = { path = "../fluent-wvr" }
axum = { workspace = true }
bon = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
futures-util = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The tree oracle for proof: test targets compare the compiled loop against
# it, while shipping builds carry no interpreter. A dev-dependency never
# reaches the shipping library.
protopyne-kernels = { path = "../protopyne-kernels", features = ["oracle"] }
# The shared grant fixture (one baseline + the deny order) for every test target
# that arms a grant; a dev-dependency never reaches the shipping library.
protopyne-strategy = { path = "../protopyne-strategy", features = ["test-support"] }
criterion = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = "0.26"
syn = { workspace = true }
tempfile = { workspace = true }
arrow = { version = "59", default-features = false }
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "zstd"] }

[[bench]]
name = "backtest_path"
harness = false

[[bench]]
name = "history_load"
harness = false

[[test]]
name = "fanout_serial"
path = "tests/fanout_serial.rs"

[lints]
workspace = true
