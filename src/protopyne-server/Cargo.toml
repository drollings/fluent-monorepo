[package]
name = "protopyne-server"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
default = []
# `pine` passes through the kernels Pine runtime for the headless
# integration proofs and the native-vs-Pine bench. Default-off: the shipped
# server serves kernels + research only, so the release closure carries no
# language runtime.
pine = ["protopyne-kernels/pine"]

[dependencies]
protopyne-types = { path = "../protopyne-types" }
protopyne-kernels = { path = "../protopyne-kernels", default-features = false, features = ["research"] }
protopyne-strategy = { path = "../protopyne-strategy" }
# The store's optional `parquet` surface (sealed snapshots) is not on the
# server's data path yet, so the server consumes the store with its default
# features off. This keeps the store's lean feature-off closure honest: a
# dependent that enabled the default would make `--no-default-features` a
# lie. A future milestone that puts snapshots on the server path enables the
# feature here explicitly.
protopyne-store = { path = "../protopyne-store", default-features = false }
protopyne-venue = { path = "../protopyne-venue" }
protopyne-chart-model = { path = "../protopyne-chart-model" }
protopyne-view = { path = "../protopyne-view" }
common-core = { path = "../common-core" }
fluent-concurrency = { path = "../fluent-concurrency" }
fluent-dag = { path = "../dag" }
fluent-wvr = { path = "../fluent-wvr" }
axum = { workspace = true }
bon = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
futures-util = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
reqwest = { workspace = true }
tokio-tungstenite = "0.26"
syn = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "backtest_path"
harness = false

[lints]
workspace = true
