[package]
name = "protopyne-venue"
version.workspace = true
edition.workspace = true
autotests = false
autobenches = false

[features]
live-ai = []

[dependencies]
protopyne-types = { path = "../protopyne-types" }
protopyne-kernels = { path = "../protopyne-kernels", default-features = false }
# Venue uses only the store's health reading, never the optional sealed
# snapshot surface, so it consumes the store with default features off. This
# keeps the store's lean feature-off closure honest through the venue→store
# and server→store dependency chains.
protopyne-store = { path = "../protopyne-store", default-features = false }
protopyne-strategy = { path = "../protopyne-strategy" }
common-core = { path = "../common-core" }
fluent-wvr = { path = "../fluent-wvr" }
fluent-concurrency = { path = "../fluent-concurrency" }
bon = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
rust_decimal = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The shared grant fixture (one baseline + the deny order) for arming tests.
protopyne-strategy = { path = "../protopyne-strategy", features = ["test-support"] }
# Test-only double for the decline-lock contrast: the macro's accept-all
# surface is demonstrated, never adopted.
fluent-wvr-testutil = { path = "../fluent-wvr-testutil" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["live-ai"]
