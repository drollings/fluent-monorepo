[package]
autotests = false
autobenches = false
name = "guidance-ontology"
version.workspace = true
edition.workspace = true

[dependencies]
fluent-types = { path = "../types" }
# M3 (spacy-rs split): the neutral ConceptStore/TaxonomyHierarchy home.
fluent-concept = { path = "../concept" }
guidance-rdf = { path = "../rdf" }
# Shared layers: generic registries/sync/string/score (common-core) and the
# dependency-graph + transitive-closure index (fluent-dag) replace the local
# hand-rolled graph, registry, and lock helpers.
common-core = { path = "../common-core" }
fluent-dag = { path = "../dag" }
blake3 = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# 11.8: register YaGoLoader output through spacy-rs' ConceptStore + resolver
# (dev-only; spacy-rs never depends on ontology — §15 boundary).
spacy-rs = { path = "../spacy-rs" }

[build-dependencies]
serde_json = { workspace = true }

[[test]]
name = "doc_stubs"
path = "tests/doc_stubs.rs"

[lints]
workspace = true
